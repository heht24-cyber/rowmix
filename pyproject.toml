[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rowmix-cpu"
version = "0.1.0"
description = "Byte-budgeted mixed int4/int8 compiler and portable CPU runtime"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
experiments = ["scikit-learn>=1.3"]
tuning = ["scipy>=1.10"]
onnx = ["onnx>=1.18,<2"]
validation = ["onnx>=1.18,<2", "onnxruntime>=1.21,<2", "scikit-learn>=1.3"]

[project.scripts]
rowmix = "rowmix.cli:main"
rowmix-onnx = "rowmix.onnx_import:main"
rowmix-select = "rowmix.select:main"

[tool.setuptools]
packages = ["rowmix"]
